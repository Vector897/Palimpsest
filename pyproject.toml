[project]
name = "palimpsest"
version = "0.0.1"
description = "Production-grade agent memory layer on CockroachDB — consolidation, temporal arbitration, forgetting curves, via MCP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "mcp>=1.0",
    "boto3>=1.34",
    "anthropic[bedrock]>=0.60",
    "certifi",
    "pydantic>=2.7",
]

[project.scripts]
palimpsest-mcp = "palimpsest.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
